name: release-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build derived data
        run: |
          set -o pipefail
          python scripts/verify_all.py --build-only 2>&1 | tee build.log
      - name: Show build failure summary
        if: failure()
        run: |
          echo '### Build output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          msg=$(tail -25 build.log 2>/dev/null | tr '\n' ' ' | cut -c1-1800)
          echo "::error title=Build failure::$msg"
      - name: Reject unapproved changes to data or reports
        run: |
          git status --porcelain
          # generatedAt/commit/dirty فقط provenanceِ زمان‌دارند؛ هر تغییرِ محتوایی
          # در data/ یا گزارش‌ها باید گیت را قرمز کند.
          if ! git diff --exit-code \
            --ignore-matching-lines='generatedAt' \
            --ignore-matching-lines='workingTreeDirty' \
            --ignore-matching-lines='commit' \
            --ignore-matching-lines='زمانِ تولید' \
            --ignore-matching-lines='درختِ کاری' \
            -- data reports/audit data/review/verification-queue.json \
            > build-diff.txt 2>&1; then
            cat build-diff.txt
            msg=$(head -40 build-diff.txt | tr '\n' ' ' | cut -c1-1800)
            echo "::error title=Unapproved build diff::$msg"
            exit 1
          fi
      - name: Verify build is reproducible
        run: python scripts/check_build_reproducibility.py
      - name: Validate release gate (engine, history, reports, 119 tests)
        run: python scripts/verify_all.py --audit-only
      - name: Upload gate reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            reports/history-audit.md
            reports/history-audit.json
            reports/statistics-audit.md
            reports/identity-review-audit.md
            reports/web-consistency.md
            reports/ocr-status.md
            build.log
          if-no-files-found: ignore
