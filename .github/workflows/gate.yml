name: release-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build derived data
        run: python scripts/verify_all.py --build-only
      - name: Validate release gate (engine, history, reports, 86 tests)
        run: python scripts/verify_all.py --audit-only
      - name: Upload gate reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            reports/history-audit.md
            reports/history-audit.json
            reports/statistics-audit.md
            reports/identity-review-audit.md
            reports/web-consistency.md
            reports/ocr-status.md
          if-no-files-found: ignore
